name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.11 / ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Ruff
        run: python -m ruff check .

      - name: Pytest
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests ui_app.py ui_app_v2.py ui_app_v3.py

      - name: Public release preflight
        run: python scripts/public_release_preflight.py

      - name: Verify repository remains clean
        shell: python
        run: |
          import subprocess
          status = subprocess.check_output(
              ["git", "status", "--porcelain"],
              text=True,
          )
          print(status)
          if status.strip():
              raise SystemExit("Repository became dirty during CI")
